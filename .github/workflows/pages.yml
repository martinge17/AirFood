name: Deploy PWA demo to GitHub Pages

# Lives on the ghpages branch only; the build uses sample mock data (no API needed).
on:
  push:
    branches: [ghpages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # --base matches the project-pages path /<repo>/; VITE_USE_MOCK serves mock data
      - run: cd web && npm ci && npm run build -- --base /AirFood/
        env:
          VITE_USE_MOCK: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
